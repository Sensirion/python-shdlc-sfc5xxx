[tool:pytest]
addopts = --cov=sensirion_shdlc_sfc5xxx
markers =
    needs_device: Marks tests which require a device to be connected.

[coverage:run]
branch = True

[flake8]
exclude = .eggs, .git, .pytest_cache, .tox, __pycache__, build, dist, gitlab_tempenv
max-line-length = 120
statistics = true
ignore = E501,  W292, W391, F401
